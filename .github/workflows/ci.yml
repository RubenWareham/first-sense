name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WForge
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: WForge/pyproject.toml
      - name: Install core and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test core without ML backends
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src examples tests
      - name: Check formatting
        run: python -m ruff format --check src examples tests
      - name: Check types
        run: python -m mypy
      - name: Build source distribution and wheel
        run: python -m build
