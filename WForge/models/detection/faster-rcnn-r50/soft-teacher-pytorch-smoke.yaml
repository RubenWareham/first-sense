schema_version: 1
model: mmdetection/faster-rcnn-r50
task: detect
profile: smoke
description: >-
  PyTorch-style Soft Teacher execution check. Supply pretraining_run for SimSiam
  backbone initialization or detector_run for a compatible supervised detector.
  Low thresholds exercise unlabeled losses, not a recommended accuracy recipe.
upstream:
  repository: https://github.com/open-mmlab/mmdetection
  version: 3.3.0
  reference: configs/soft_teacher/soft-teacher_faster-rcnn_r50-caffe_fpn_180k_semi-0.1-coco.py
  license: Apache-2.0
training:
  schema_version: 1
  learning: semi_supervised
  max_iters: 2
  imgsz: 128
  batch: 2
  seed: 0
  device: cpu
  backend_options:
    backbone_style: pytorch
    lr: 0.000001
    pseudo_label_initial_score_thr: 0.0
    rpn_pseudo_thr: 0.0
    cls_pseudo_thr: 0.0
    reg_pseudo_thr: 1.0
