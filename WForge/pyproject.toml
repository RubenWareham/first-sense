[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wvision"
version = "0.1.0.dev0"
description = "Reproducible workflows around existing computer vision models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["computer-vision", "object-detection", "semi-supervised-learning", "self-supervised-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0.2,<7", "Pillow>=10.3,<12"]

[project.optional-dependencies]
ultralytics = ["ultralytics==8.3.4"]
onnx = ["onnx==1.17.0", "onnxruntime==1.20.1"]
evaluation = ["pycocotools==2.0.11"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-PyYAML", "types-Pillow", "build>=1.2,<2"]

[project.scripts]
wvision = "wvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not integration'"
markers = [
    "ultralytics: actual in-process YOLO backend required",
    "distributed: actual multi-GPU upstream training; explicitly selected",
    "cuda: actual single-NVIDIA-GPU execution; explicitly selected",
    "integration: real upstream execution; explicitly selected",
    "mmdetection: isolated upstream MMDetection environment required",
    "dinov3: isolated Transformers DINOv3 environment required",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wvision"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "ultralytics.*", "mmcv.*", "mmdet.*", "mmengine.*", "mmpretrain.*",
          "transformers.*", "safetensors.*", "pycocotools.*", "onnx.*", "onnxruntime.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
